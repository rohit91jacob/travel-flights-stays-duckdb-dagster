travel:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('TRAVEL_DUCKDB_PATH', '../data/warehouse/travel.duckdb') }}"
      threads: "{{ env_var('TRAVEL_DUCKDB_THREADS', '4') | int }}"
      settings:
        memory_limit: "{{ env_var('TRAVEL_DUCKDB_MEMORY_LIMIT', '2GB') }}"
    ci:
      type: duckdb
      path: "{{ env_var('TRAVEL_DUCKDB_PATH', '../data/warehouse/travel_ci.duckdb') }}"
      threads: 2
      settings:
        memory_limit: "{{ env_var('TRAVEL_DUCKDB_MEMORY_LIMIT', '1GB') }}"
    prod:
      type: duckdb
      path: "{{ env_var('TRAVEL_DUCKDB_PATH') }}"
      threads: "{{ env_var('TRAVEL_DUCKDB_THREADS', '4') | int }}"
      settings:
        memory_limit: "{{ env_var('TRAVEL_DUCKDB_MEMORY_LIMIT', '4GB') }}"

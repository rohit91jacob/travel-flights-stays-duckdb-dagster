# Dagster instance for the Docker Compose deployment (Postgres-backed).

storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_POSTGRES_HOST
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

concurrency:
  # DuckDB is single-writer: every step that opens the warehouse claims the "duckdb" pool.
  pools:
    default_limit: 1
    granularity: op
  runs:
    max_concurrent_runs: 4
    tag_concurrency_limits:
      - key: travel/warehouse
        value: duckdb
        limit: 1

# Re-launch runs whose worker crashed; asset failures are handled by op retry policies.
run_retries:
  enabled: true
  max_retries: 2
  retry_on_asset_or_op_failure: false

run_monitoring:
  enabled: true
  start_timeout_seconds: 300
  max_runtime_seconds: 14400

telemetry:
  enabled: false

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dagster:
        patterns: ["dagster*"]
      dbt:
        patterns: ["dbt-*"]
    ignore:
      # dagster-postgres run storage needs SQLAlchemy < 2.1
      - dependency-name: sqlalchemy
        versions: [">=2.1"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python 3.13+ base images: the pinned libraries are not on 3.13+ yet; take 3.12 patches only
      - dependency-name: python
        versions: [">=3.13"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
